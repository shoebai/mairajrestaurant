@'
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Mairaj Restaurant</title>
    <script type="text/javascript">
      // Single Page App redirect for GitHub Pages.
      // On the custom domain (mairajhyd.com) the site lives at the root: keep 0 segments.
      // On username.github.io/repo it lives in a folder: keep 1 segment.
      var pathSegmentsToKeep = /\.github\.io$/.test(window.location.hostname) ? 1 : 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
'@ | Set-Content -Path public\404.html -Encoding utf8
