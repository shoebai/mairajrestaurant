<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Mairaj Restaurant</title>
    <script type="text/javascript">
      // Single Page App redirect for GitHub Pages.
      // Saves the path the visitor actually wanted, then bounces to index.html
      // so React Router can pick it back up.
      var pathSegmentsToKeep = 1; // = number of segments in your repo's base path (usually 1 for a project page)
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
