<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mairaj Restaurant — Indian Cuisine, Madinah</title>
    <meta name="description" content="Mairaj Restaurant in Madinah: Hyderabadi biryani, tandoori, curries and family meals. Open daily 1 PM – 12 AM. Order on WhatsApp or reserve a table. مطعم معراج للمأكولات الهندية في المدينة المنورة." />
    <link rel="canonical" href="https://mairajhyd.com/" />
    <meta name="theme-color" content="#0E4D4F" />

    <!-- How the link looks when shared on WhatsApp, Facebook, X, etc. -->
    <meta property="og:type" content="restaurant" />
    <meta property="og:site_name" content="Mairaj Restaurant" />
    <meta property="og:title" content="Mairaj Restaurant — Indian Cuisine, Madinah" />
    <meta property="og:description" content="Hyderabadi biryani, tandoori and family meals in Madinah. Open daily 1 PM – 12 AM." />
    <meta property="og:url" content="https://mairajhyd.com/" />
    <meta property="og:image" content="https://mairajhyd.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ar_SA" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Business details Google can show in search results -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Restaurant",
        "name": "Mairaj Restaurant",
        "alternateName": "مطعم معراج",
        "url": "https://mairajhyd.com/",
        "image": "https://mairajhyd.com/og-image.jpg",
        "telephone": "+966580748325",
        "servesCuisine": ["Indian", "Hyderabadi"],
        "priceRange": "$$",
        "acceptsReservations": "True",
        "menu": "https://mairajhyd.com/menu",
        "hasMap": "https://maps.app.goo.gl/TC1TU7UGmo3D5pMu8",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Madinah",
          "addressCountry": "SA"
        },
        "openingHoursSpecification": [{
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
          "opens": "13:00",
          "closes": "23:59"
        }]
      }
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(
            null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
